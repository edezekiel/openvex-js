name: CI

on:
  pull_request:
    branches: [main]

jobs:
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Biome CLI
        uses: biomejs/setup-biome@v2
        with:
          version: latest
      - name: Run Biome
        run: biome ci

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Load .env
        run: cat .env >> $GITHUB_ENV

      - name: Cache vexctl binary
        uses: actions/cache@v4
        id: cache-vexctl
        with:
          path: .bin/vexctl
          key: vexctl-${{ env.VEXCTL_VERSION }}-linux-amd64

      - name: Install vexctl
        if: steps.cache-vexctl.outputs.cache-hit != 'true'
        run: pnpm run install-vexctl

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Upload vexctl
        uses: actions/upload-artifact@v4
        with:
          name: vexctl
          path: .bin/vexctl

  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Download vexctl
        uses: actions/download-artifact@v4
        with:
          name: vexctl
          path: .bin/

      - name: Make vexctl executable
        run: chmod +x .bin/vexctl

      - name: Run tests
        run: pnpm test
