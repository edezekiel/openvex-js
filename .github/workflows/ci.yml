name: CI

on:
  pull_request:
    branches: [main]

jobs:
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Biome CLI
        uses: biomejs/setup-biome@v2
        with:
          version: latest
      - name: Run Biome
        run: biome ci

  build-and-test:
    name: Build and Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable TypeScript stripping for older Node
        if: matrix.node-version < 23
        run: echo "NODE_OPTIONS=--experimental-strip-types" >> $GITHUB_ENV

      - name: Get vexctl version
        id: vexctl-version
        run: |
          VERSION=$(grep -o 'VEXCTL_VERSION = "[^"]*"' scripts/install-vexctl.ts | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected vexctl version: $VERSION"

      - name: Cache vexctl binary
        uses: actions/cache@v4
        id: cache-vexctl
        with:
          path: .bin/vexctl
          key: vexctl-${{ steps.vexctl-version.outputs.version }}-linux-amd64
          restore-keys: |
            vexctl-${{ steps.vexctl-version.outputs.version }}-
            vexctl-

      - name: Install vexctl
        if: steps.cache-vexctl.outputs.cache-hit != 'true'
        run: pnpm run install-vexctl

      - name: Make vexctl executable
        run: chmod +x .bin/vexctl

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build
