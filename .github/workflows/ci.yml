name: CI

on:
  pull_request:
    branches: [main]

jobs:
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Biome CLI
        uses: biomejs/setup-biome@v2
        with:
          version: latest
      - name: Run Biome
        run: biome ci

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get vexctl version
        id: vexctl-version
        run: |
          VERSION=$(grep -o 'VEXCTL_VERSION = "[^"]*"' scripts/install-vexctl.ts | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected vexctl version: $VERSION"

      - name: Cache vexctl binary
        uses: actions/cache@v4
        id: cache-vexctl
        with:
          path: .bin/vexctl
          key: vexctl-${{ steps.vexctl-version.outputs.version }}-linux-amd64
          restore-keys: |
            vexctl-${{ steps.vexctl-version.outputs.version }}-
            vexctl-

      - name: Install vexctl
        if: steps.cache-vexctl.outputs.cache-hit != 'true'
        run: npm run install-vexctl

      - name: Make vexctl executable
        run: chmod +x .bin/vexctl

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
